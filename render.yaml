services:
  - type: web
    name: ai-hiring-copilot-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-hiring-copilot-db
          property: connectionString

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_FALLBACK
        value: "True"

      - key: ENVIRONMENT
        value: "production"

databases:
  - name: ai-hiring-copilot-db
    plan: free

